name: Build Kernel

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download kernel source from Release
        run: |
          cd "$GITHUB_WORKSPACE"
          gh release download "$RELEASE_TAG" --pattern "kernel_4.4.23_v4.tar.gz" --dir . \
            --repo "${{ github.repository }}"
          mkdir -p src
          tar -xzf kernel_4.4.23_v4.tar.gz -C src
          # package top dir is "newkernel"; normalize to "kernel"
          if [ -d src/newkernel ] && [ ! -d src/kernel ]; then mv src/newkernel src/kernel; fi
          # Windows-created tarballs lose exec bits; restore them broadly
          find src -type f \( -name '*.sh' -o -name '*.pl' -o -name '*.py' -o -name 'gen_*' -o -name '*_gen_*' \) -exec chmod +x {} + 2>/dev/null || true
          find src/kernel/scripts src/kernel/arch -type f \( -name 'mk*' -o -name '*config' -o -name 'check*' -o -name 'build*' \) -exec chmod +x {} + 2>/dev/null || true
          chmod +x src/kernel/drivers/huawei_platform/oases/inlinehook_gen_off 2>/dev/null || true
          # Windows is case-insensitive: UPPERCASE-named netfilter headers need lowercase aliases on ext4
          for d in src/kernel/include/uapi/linux/netfilter src/kernel/include/uapi/linux/netfilter_ipv4 src/kernel/include/uapi/linux/netfilter_ipv6; do
            for f in "$d"/xt_*.h "$d"/ipt_*.h "$d"/ip6t_*.h; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              lc=$(echo "$base" | tr 'A-Z' 'a-z')
              if [ "$base" != "$lc" ] && [ ! -e "$d/$lc" ]; then
                cp "$f" "$d/$lc"
                echo "[+] alias $base -> $lc"
              fi
            done
          done
          echo "[+] kernel source ready"
          # Huawei renamed several netfilter uapi headers to UPPERCASE but .c files include lowercase;
          # create lowercase symlinks/copies so includes resolve on case-sensitive ext4
          cd src/kernel/include/uapi/linux/netfilter
          for f in xt_*.h; do
            lc=$(echo "$f" | tr 'A-Z' 'a-z')
            if [ "$f" != "$lc" ] && [ ! -e "$lc" ]; then
              cp "$f" "$lc"
              echo "[+] lowercase alias: $f -> $lc"
            fi
          done
          cd "$GITHUB_WORKSPACE"
          ls -la src/kernel | head
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || 'v4.4.23-sukisu' }}
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc libncurses5-dev libssl-dev \
            flex bison bc kmod cpio device-tree-compiler python2 \
            gcc-arm-none-eabi 2>/dev/null || true

      - name: Download aarch64-linux-android-4.9 toolchain
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -Ls -o toolchain.tar.gz \
            "https://codeload.github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/tar.gz/refs/heads/cm-14.1"
          mkdir -p toolchain
          tar -xzf toolchain.tar.gz -C toolchain --strip-components=1
          ls toolchain/bin/
          ./toolchain/bin/aarch64-linux-android-gcc --version | head -1

      - name: Integrate KernelSU v0.9.5
        run: |
          cd "$GITHUB_WORKSPACE/src/kernel"
          # remove any kernelsu dir shipped inside the source tarball (SukiSU leftovers)
          rm -rf drivers/kernelsu
          # official KernelSU v0.9.5 - last version with old-kernel (4.4/Huawei hisi) support
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -s v0.9.5
          # ensure defconfig has KPROBES + KSU + OVERLAY_FS (in case upstream defconfig differs)
          grep -q "^CONFIG_KPROBES=y" arch/arm64/configs/merge_hi6250_defconfig || \
            sed -i 's/^# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' arch/arm64/configs/merge_hi6250_defconfig
          grep -q "^CONFIG_KSU=y" arch/arm64/configs/merge_hi6250_defconfig || \
            echo "CONFIG_KSU=y" >> arch/arm64/configs/merge_hi6250_defconfig
          grep -q "^CONFIG_OVERLAY_FS=y" arch/arm64/configs/merge_hi6250_defconfig || \
            echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/merge_hi6250_defconfig
          # Huawei ships xt_dscp.c (match) but Makefile also wants xt_DSCP.o (target, no source); disable it
          sed -i 's/^CONFIG_NETFILTER_XT_TARGET_DSCP=y/# CONFIG_NETFILTER_XT_TARGET_DSCP is not set/' arch/arm64/configs/merge_hi6250_defconfig
          # Huawei 4.4 has no current_security() macro; use current_cred()->security directly
          sed -i 's/const struct task_security_struct \*tsec = current_security();/const struct task_security_struct *tsec = (const struct task_security_struct *)current_cred()->security;/' drivers/kernelsu/selinux/selinux.c
          grep -q "current_cred()->security" drivers/kernelsu/selinux/selinux.c && echo "[OK] selinux current_security patched" || echo "[WARN] current_security patch did not apply"
          # Huawei 4.4 groups_sort() is static (not exported); inline a shell sort for <4.9 kernels
          python3 - <<'EOF'
import re
p = 'drivers/kernelsu/core_hook.c'
c = open(p).read()
needle = '\tgroups_sort(group_info);\n\tset_groups(cred, group_info);'
repl = """#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 9, 0)
	{
		/* groups_sort is static in kernel/groups.c on 4.4; inline a simple shell sort */
		int base, max, stride;
		int gidsetsize = group_info->ngroups;
		for (stride = 1; stride < gidsetsize; stride = 3 * stride + 1) ;
		stride /= 3;
		while (stride) {
			max = gidsetsize - stride;
			for (base = 0; base < max; base++) {
				int left = base;
				int right = left + stride;
				kgid_t tmp = GROUP_AT(group_info, right);
				while (left >= 0 && gid_gt(GROUP_AT(group_info, left), tmp)) {
					GROUP_AT(group_info, right) = GROUP_AT(group_info, left);
					right = left;
					left -= stride;
				}
				GROUP_AT(group_info, right) = tmp;
			}
			stride /= 3;
		}
	}
#else
	groups_sort(group_info);
#endif
	set_groups(cred, group_info);"""
if needle in c:
    c = c.replace(needle, repl)
    open(p, 'w').write(c)
    print('[OK] groups_sort inlined for 4.4')
else:
    print('[WARN] groups_sort pattern not found')
EOF
          echo "[+] KernelSU v0.9.5 integrated for 4.4"

      - name: Build kernel
        run: |
          cd "$GITHUB_WORKSPACE/src/kernel"
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          mkdir -p ../out
          # GCC10+ defaults to -fno-common, breaking old dtc (multiple definition of yylloc)
          sed -i 's/^HOSTCFLAGS_DTC := -I$(src) -I$(src)\/libfdt/HOSTCFLAGS_DTC := -fcommon -I$(src) -I$(src)\/libfdt/' scripts/dtc/Makefile
          make O=../out merge_hi6250_defconfig
          # Huawei has no xt_DSCP.c source; keep target off in generated .config
          ./scripts/config --file ../out/.config --disable NETFILTER_XT_TARGET_DSCP
          make O=../out -j2 Image.gz

      - name: Collect artifacts
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist
          cp src/out/arch/arm64/boot/Image.gz dist/ 2>/dev/null || true
          cp src/out/arch/arm64/boot/zImage* dist/ 2>/dev/null || true
          ls -la dist/

      - name: Build Android boot image
        run: |
          sudo apt-get install -y mkbootimg 2>/dev/null || pip3 install mkbootimg 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          # Match original device boot image: page_size=2048, kernel_addr=0x480000, tags=0x1300000, ramdisk empty (separate partition)
          if command -v mkbootimg >/dev/null 2>&1; then
            mkbootimg \
              --kernel dist/Image.gz \
              --base 0x00000000 \
              --kernel_offset 0x00480000 \
              --tags_offset 0x01300000 \
              --page_size 2048 \
              --ramdisk dummy_ramdisk.img \
              -o dist/boot.img
          else
            echo "mkbootimg not available" >&2
            exit 1
          fi
          ls -la dist/boot.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-images
          path: dist/

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          for f in dist/*; do
            gh release upload "${{ github.event.release.tag_name }}" "$f" --repo "${{ github.repository }}" || true
          done
